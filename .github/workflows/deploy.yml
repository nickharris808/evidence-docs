name: deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install mkdocs-material
      - name: Build (strict — a broken internal link fails the build)
        run: mkdocs build --strict
      - name: Every generated page must still match the code it describes
        # The reference section is produced by RUNNING the tools. This does not regenerate here
        # (the tools are not installed in this job); it asserts the committed pages carry the
        # generator's banner, so a hand-edited reference page is caught. The full drift check
        # runs in the monorepo, where the packages are installed.
        run: |
          for f in docs/reference/*.md; do
            head -1 "$f" | grep -q "GENERATED by oss/tools/gen_site.py" \
              || { echo "$f lost its generated banner — was it hand-edited?"; exit 1; }
          done
          echo "all reference pages are generator-produced"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
